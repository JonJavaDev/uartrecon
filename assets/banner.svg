<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="4" fill="url(#accent)"/>

  <!-- Ikon chip -->
  <g transform="translate(60,90)">
    <rect x="0" y="0" width="100" height="100" rx="14" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
    <g stroke="#58a6ff" stroke-width="4" stroke-linecap="round">
      <line x1="-14" y1="20" x2="0" y2="20"/><line x1="-14" y1="40" x2="0" y2="40"/>
      <line x1="-14" y1="60" x2="0" y2="60"/><line x1="-14" y1="80" x2="0" y2="80"/>
      <line x1="100" y1="20" x2="114" y2="20"/><line x1="100" y1="40" x2="114" y2="40"/>
      <line x1="100" y1="60" x2="114" y2="60"/><line x1="100" y1="80" x2="114" y2="80"/>
    </g>
    <text x="50" y="64" font-size="40" font-weight="700" fill="#3fb950" text-anchor="middle" font-family="Consolas,monospace">U&gt;</text>
  </g>

  <!-- Judul -->
  <text x="200" y="135" font-size="56" font-weight="700" fill="#e6edf3">UARTRecon</text>
  <text x="202" y="172" font-size="20" fill="#8b949e">UART Recon &amp; Analysis Toolkit</text>

  <!-- Tagline -->
  <text x="202" y="212" font-size="16" fill="#58a6ff" font-family="Consolas,monospace">detect · capture · analyze · export</text>

  <!-- Badge kecil -->
  <g transform="translate(202,232)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#21262d" stroke="#30363d"/>
    <text x="75" y="18" font-size="13" fill="#3fb950" text-anchor="middle">read-only first</text>
  </g>
</svg>
