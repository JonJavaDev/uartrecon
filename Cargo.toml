[workspace]
resolver = "2"
members = [
    "crates/uartrecon-core",
    "crates/uartrecon-cli",
    "crates/uartrecon-tui",
    "crates/uartrecon-gui",
]

# `cargo run` tanpa argumen -> jalankan CLI (yang membuka menu interaktif).
default-members = ["crates/uartrecon-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/JonJavaDev/uartrecon"
homepage = "https://github.com/JonJavaDev/uartrecon"
documentation = "https://github.com/JonJavaDev/uartrecon#readme"
readme = "README.md"
keywords = ["uart", "serial", "embedded", "recon", "firmware"]
categories = ["command-line-utilities", "hardware-support", "embedded"]
authors = ["UARTRecon Contributors"]

[workspace.dependencies]
# Core deps
serialport = "4"
clap = { version = "4", features = ["derive"] }

anyhow = "1"
thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sha2 = "0.10"
hex = "0.4"
regex = "1"

crossterm = "0.29"
ratatui = "0.29"

# GUI
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36"
egui_plot = "0.37"
rfd = "0.17"

# Internal crates
uartrecon-core = { path = "crates/uartrecon-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
