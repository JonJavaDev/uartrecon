name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- CLI + TUI (cross-compile friendly, tanpa GUI/winit) ----
  build-cli-tui:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: uartrecon-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: uartrecon-linux-aarch64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: uartrecon-windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: uartrecon-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: uartrecon-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install cross linker (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build (cli + tui)
        run: cargo build --release -p uartrecon-cli -p uartrecon-tui --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }}.tar.gz uartrecon uartrecon-tui

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.archive }}.zip uartrecon.exe uartrecon-tui.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.zip
          if-no-files-found: ignore

  # ---- GUI (native only: winit tidak bisa cross-compile) ----
  build-gui:
    name: Build GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: uartrecon-gui-linux-x86_64
          - os: windows-latest
            archive: uartrecon-gui-windows-x86_64
          - os: macos-latest
            archive: uartrecon-gui-macos
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Build GUI
        run: cargo build --release -p uartrecon-gui

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }}.tar.gz -C target/release uartrecon-gui

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: 7z a ${{ matrix.archive }}.zip target/release/uartrecon-gui.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.zip
          if-no-files-found: ignore

  # ---- Buat GitHub Release ----
  release:
    name: Create release
    needs: [build-cli-tui, build-gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
